[workspace]
members = [".", "./sertyp_macros"]

[workspace.package]
edition = "2024"
authors = ["Uhrendoktor"]
version = "0.1.4"
license = "MIT"
repository = "https://github.com/Uhrendoktor/sertyp"
readme = "README.md"
keywords = ["wasm", "serialization", "deserialization", "typst"]
categories = ["encoding", "wasm", "api-bindings"]


[package]
name = "sertyp"
description = "Rust data structures for Typst values with serialization and deserialization from and into the sertyp CBOR format. Allows for straighforward communication between typst and WASM plugins"
edition.workspace = true
authors.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["lib"]

[features]
default = ["content"]
content = ["dep:rangemap", "dep:chumsky", "dep:num-traits"]

[dependencies]
sertyp_macros = { path = "./sertyp_macros", version = "0.1.4" }

paste = "1.0.15"
serde = { version = "1.0.228", features = ["derive"] }
serde_cbor = "0.11.2"
rangemap = { version = "1.7.1", optional = true }
chumsky = { version = "0.13.0", optional = true }
num-traits = { version = "0.2.19", optional = true }
derive_more = { version = "2.1.1", features = ["full"] }

[dev-dependencies]
serde_json = "1.0.150"
